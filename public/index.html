  <!-- Mapbox GL JS chargé via CDN (build pré-compilé par Mapbox, jamais touché
       par Terser) -> évite le bug "ReferenceError: x is not defined" au
       "npm run build". On utilise unpkg, qui reflète exactement npm : la version
       3.24.0 (celle du package.json) y est garantie. Expose window.mapboxgl,
       utilisé par OceanMap.jsx et PacificMap.jsx. Identique en dev et en prod. -->
  <link href="https://unpkg.com/mapbox-gl@3.24.0/dist/mapbox-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/mapbox-gl@3.24.0/dist/mapbox-gl.js"></script>
